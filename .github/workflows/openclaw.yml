name: OpenClaw plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: openclaw-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
    working-directory: plugins/openclaw

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-plugin
        with:
          plugin: openclaw
      - run: pnpm run check
